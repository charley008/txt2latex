services:
  app:
    build:
      context: .
    env_file: .env
    ports:
      - "${WEB_PORT:-8080}:3000"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      start_period: 5s
      interval: 30s
      timeout: 5s
      retries: 3
