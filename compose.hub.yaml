services:
  txt2latex:
    image: charley008/txt2latex:latest
    ports:
      - "8080:3000"
    restart: unless-stopped
    network_mode: bridge
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
