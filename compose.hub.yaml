services:
  txt2latex:
    image: charley008/txt2latex:latest
    ports:
      - "8080:3000"
    restart: unless-stopped
    network_mode: bridge
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      start_period: 5s
      interval: 30s
      timeout: 5s
      retries: 3
