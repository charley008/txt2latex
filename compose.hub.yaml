# Set DOCKERHUB_USERNAME in .env before starting.
services:
  app:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/txt2latex:${IMAGE_TAG:-latest}
    env_file: .env
    ports:
      - "${WEB_PORT:-8080}:3000"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
